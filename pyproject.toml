[project]
name = "career-mate"
version = "0.1.0"
description = "Personal career assistant: job offer capture, application tracking and AI-generated documents."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.128.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.12.5",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=6.6.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.21",
    "requests>=2.32.5",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

