[project]
name = "career-mate"
version = "0.1.0"
description = "Personal career assistant: job offer capture, application tracking and AI-generated documents."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.128.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.6",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.0.5",
    "numpy>=2.4.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pypdf>=6.6.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.21",
    "reportlab>=4.4.9",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

